# SPA fallback (react-router client-side routing — see App.tsx's
# routes) plus long-cache immutable hashed assets Vite already
# fingerprints in its filenames.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
