# SPA fallback (react-router client-side routing — see App.tsx's
# routes) plus long-cache immutable hashed assets Vite already
# fingerprints in its filenames.
#
# Security headers: this file sends only the Content-Security-Policy,
# which the image build generates from its own build args
# (scripts/csp.mjs). The rest (HSTS, nosniff, Referrer-Policy, ...) are
# set once for the SPA and the api in the root Caddyfile.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # nginx drops server-level add_header lines in any location that has
    # its own, so every location includes this itself.
    location / {
        include /etc/nginx/csp-header.conf;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        include /etc/nginx/csp-header.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
