name: CI

# Every check here is the same one a contributor is expected to run
# locally before pushing (see the root README's "Development" section)
# — this workflow just makes that non-optional. All three services run
# on every push/PR regardless of which files changed: the repo is
# small enough that this is simpler and safer than path filtering,
# which risks silently skipping a check on a shared-file change.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  solver:
    name: solver (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/solver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  api:
    name: api (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # api imports isd_solver directly and doesn't declare it as a
      # dependency (see the comment in services/api/pyproject.toml) —
      # install order matters here.
      - run: pip install -e ../solver
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
        env:
          # In-memory SQLite (tests/conftest.py) — no external DB needed.
          ISD_API_ENVIRONMENT: test

  web:
    name: web (oxlint, build, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run test

  docker:
    name: docker build (api, web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -f services/api/Dockerfile -t isd-api:ci .
      - name: Build web image
        run: docker build -f services/web/Dockerfile -t isd-web:ci services/web
      - name: Smoke-test the api image starts and answers /health
        run: |
          docker run -d --name isd-api-ci -p 8000:8000 isd-api:ci
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health
          docker logs isd-api-ci
          docker rm -f isd-api-ci
