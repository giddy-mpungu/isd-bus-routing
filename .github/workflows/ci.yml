name: CI

# Every check here is the same one a contributor is expected to run
# locally before pushing (see the root README's "Development" section)
# — this workflow just makes that non-optional. All three services run
# on every push/PR regardless of which files changed: the repo is
# small enough that this is simpler and safer than path filtering,
# which risks silently skipping a check on a shared-file change.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  solver:
    name: solver (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/solver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  api:
    name: api (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # api imports isd_solver directly and doesn't declare it as a
      # dependency (see the comment in services/api/pyproject.toml) —
      # install order matters here.
      - run: pip install -e ../solver
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
        env:
          # In-memory SQLite (tests/conftest.py) — no external DB needed.
          ISD_API_ENVIRONMENT: test

  api-postgres:
    name: api against real PostgreSQL (migrations + full suite)
    runs-on: ubuntu-latest
    # Proves ADR 0003/0006's production target for real, not just by
    # code review: the same migrations and the same test suite that run
    # against SQLite above, run unmodified against an actual PostgreSQL
    # server. Separate job (not a matrix add-on to `api` above) so a
    # failure here is unambiguous about which database broke.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: isd
          POSTGRES_PASSWORD: isd
          POSTGRES_DB: isd_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/api
    env:
      # psycopg (v3), not psycopg2 — see pyproject.toml's `postgres`
      # extra. The `+psycopg` in the URL is required; plain
      # `postgresql://` resolves to psycopg2, which isn't installed.
      ISD_API_DATABASE_URL: postgresql+psycopg://isd:isd@localhost:5432/isd_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ../solver
      - run: pip install -e ".[dev,postgres]"
      - name: Migrate up, down, up again, and check for drift
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Leave the database empty for the test suite's own schema management
        run: alembic downgrade base
      - run: pytest
        env:
          ISD_API_ENVIRONMENT: test
          ISD_API_TEST_DATABASE_URL: postgresql+psycopg://isd:isd@localhost:5432/isd_api

  web:
    name: web (oxlint, build, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run test

  docker:
    name: docker build (api, web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -f services/api/Dockerfile -t isd-api:ci .
      - name: Build web image
        run: docker build -f services/web/Dockerfile -t isd-web:ci services/web
      - name: Smoke-test the api image starts and answers /health
        run: |
          docker run -d --name isd-api-ci -p 8000:8000 isd-api:ci
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health
          docker logs isd-api-ci
          docker rm -f isd-api-ci

  # End-to-end (e2e/README.md): the whole system in a real browser. Two
  # complementary ways of starting it, both from nothing every time.
  e2e-seeded:
    name: e2e (fresh API + web, seeded, 2 rounds)
    runs-on: ubuntu-latest
    services:
      # The captured inbox the email tests read.
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e services/solver && pip install -e "services/api[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            services/web/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: services/web
      - run: npm ci
        working-directory: e2e
      - name: e2e code checks
        working-directory: e2e
        run: npm run lint && npm run format:check
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: node e2e/scripts/seeded-rounds.mjs --rounds 2 --mailpit http://127.0.0.1:8025
      - name: Keep the report, traces and server logs (never the logins)
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-seeded
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/.out/**/*.log
          retention-days: 7

  e2e-install:
    name: e2e (fresh install by the runbook, then seeded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: bash e2e/scripts/fresh-install.sh
      - name: Keep the report and traces (never the logins)
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-install
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
